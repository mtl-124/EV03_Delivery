server:
  port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: cliente-service
              uri: lb://cliente-service
              predicates:
                - Path=/api/clientes/**
            - id: repartidor-service
              uri: lb://repartidor-service
              predicates:
                - Path=/api/repartidores/**
            - id: entrega-service
              uri: lb://entrega-service
              predicates:
                - Path=/api/entregas/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"

---
spring:
  config:
    activate:
      on-profile: dev

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    com.tecsup: DEBUG

---
spring:
  config:
    activate:
      on-profile: test

eureka:
  client:
    enabled: false

logging:
  level:
    com.tecsup: INFO

---
spring:
  config:
    activate:
      on-profile: prod

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

logging:
  level:
    root: WARN
    com.tecsup: INFO
