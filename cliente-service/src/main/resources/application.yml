server:
  port: 8081

spring:
  application:
    name: cliente-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: "jdbc:mysql://localhost:3306/bd_cliente?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    discovery:
      enabled: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    com.tecsup: DEBUG

server:
  error:
    include-message: always
    include-stacktrace: always

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: "jdbc:h2:mem:bd_cliente;MODE=MySQL;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

logging:
  level:
    com.tecsup: INFO

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bd_cliente?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  cloud:
    discovery:
      enabled: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

logging:
  level:
    root: WARN
    com.tecsup: INFO

server:
  error:
    include-message: never
    include-stacktrace: never
